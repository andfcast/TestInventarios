<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Herramienta de manejo de inventarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Manejo de inventarios</h1>
    <br />
    <br />
    <div class="row">
        <div class="col-md-5">
            <div class="card col-md-12">
                <div class="card-body">
                    <h3 class="card-title">Agregar nuevo artículo</h3>
                    <br />
                    <div class="form-group">
                        <label for="txtNombre">Nombre del producto</label>
                        <input class="form-control" id="txtNombre" placeholder="Ingrese el nombre del artículo">
                    </div>
                    <div class="form-group">
                        <label for="txtPrecio">Precio</label>
                        <input class="form-control" id="txtPrecio" type="number" placeholder="Ingrese el precio de venta">
                    </div>
                    <div class="form-group">
                        <label for="cmbCategoria">Categoría</label>
                        <select class="form-control" id="cmbCategoria">
                            <option value="0">Selecciona una categoría</option>
                            <option value="1">Tecnología</option>
                            <option value="2">Hogar</option>
                            <option value="3">Alimentos</option>
                            <option value="4">Hogar</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="txtCantidad">Cantidad</label>
                        <input class="form-control" id="txtCantidad" type="number" placeholder="Ingrese la cantidad de artículos en inventario">
                    </div>
                    <br />
                    <button class="btn btn-primary" onclick="agregar()">Insertar</button>
                </div>
            </div>
        </div>
        <div class="col-md-1">

        </div>
        <div class="col-md-5">
            <div class="card-body">
                <h3 class="card-title">Lista de artículos en inventario</h3>
            </div>
            <br />
            <ul class="list-group" id="listaInventario"></ul>
        </div>
    </div>    
    <script src="scripts/inventario.js"></script>
    <script>
        async function cargar() {
            const res = await fetch('/api/inventario');
            const datos = await res.json();
            document.getElementById('listaInventario').innerHTML = datos.map(a => `<li class="list-group-item list-group-item-info">${a.nombre}: ${a.categoria} - $${a.precio}. Actualmente hay ${a.cantidad}</li>`).join('');
        }

        async function agregar() {
            const nombre = document.getElementById('txtNombre').value;
            const precio = document.getElementById('txtPrecio').value;
            const idCategoria = document.getElementById('cmbCategoria').value;
            const cantidad = document.getElementById('txtCantidad').value;
            await fetch('/api/inventario', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, precio, idCategoria, cantidad })
            });
            limpiar();
            cargar();
        }
        cargar();
    </script>
</body>
</html>
